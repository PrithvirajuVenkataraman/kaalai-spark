name: KaalaiSpark Morning

on:
  schedule:
    - cron: '15 4 * * *' # 09:45 IST. Prepare, then wait until 10:00 IST.
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = connection only; digest = send today now; preview = no Telegram'
        type: choice
        options: [test, digest, preview]
        default: test

permissions:
  contents: write

concurrency:
  group: kaalai-spark-delivery
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run checks
        run: python -m unittest discover -s tests -v
      - name: Prepare and deliver
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_MODE: ${{ inputs.mode || 'digest' }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python spark.py --mode digest --wait-until-ten
          else
            python spark.py --mode "$RUN_MODE"
          fi
      - name: Save delivery state
        if: always()
        run: |
          if [ -f data/state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record daily delivery state'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
