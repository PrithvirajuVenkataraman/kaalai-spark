name: KaalaiSpark Morning

on:
  push:
    branches: [main]
    paths: ['.github/workflows/morning.yml'] # Recover today's digest after schedule repairs.
  schedule:
    - cron: '15-59/5 4 * * *' # 09:45, 09:50, ... 10:25 IST.
    - cron: '*/5 5-17 * * *' # Every five minutes, 10:30 through 23:25 IST.
    - cron: '0-25/5 18 * * *' # Every five minutes, 23:30 through 23:55 IST.
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = connection only; digest = send today now; preview = no Telegram'
        type: choice
        options: [test, digest, preview]
        default: test

permissions:
  contents: write

concurrency:
  group: kaalai-spark-delivery
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check today's delivery state
        id: delivery
        env:
          RUN_MODE: ${{ inputs.mode || 'digest' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          from datetime import datetime
          import os
          import spark
          skip = spark.skip_attempt(spark.load_state(), datetime.now(spark.IST), os.environ['EVENT_NAME'], os.environ['RUN_MODE'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('skip=' + str(skip).lower() + '\n')
          print('No delivery needed for this attempt.' if skip else 'Delivery or manual test required.')
          PY
      - name: Run checks
        if: steps.delivery.outputs.skip != 'true'
        run: python -m unittest discover -s tests -v
      - name: Prepare and deliver
        if: steps.delivery.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_MODE: ${{ inputs.mode || 'digest' }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python spark.py --mode digest --wait-until-delivery
          else
            python spark.py --mode "$RUN_MODE"
          fi
      - name: Save delivery state
        if: always()
        run: |
          if [ -f data/state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record daily delivery state'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
